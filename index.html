<head>

  <style>
    :root{color-scheme:light;--ink:#17233b;--muted:#68758b;--line:#e3e8f0;--paper:#fff;--wash:#f4f6fa;--blue:#2256c7;--blue-soft:#eaf0ff;--gold:#f2b84b;--shadow:0 8px 28px rgba(29,49,88,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--wash);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-top));backdrop-filter:blur(12px)}.day-nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day-nav a{display:grid;place-items:center;min-height:42px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:14px;font-weight:700;text-decoration:none;background:#fff}.day-nav a[aria-current="date"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(34,86,199,.24)}
    main{width:min(100% - 28px,720px);margin:24px auto 56px}.hero{padding:9px 2px 22px}.eyebrow{margin:0 0 5px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(25px,7vw,34px);line-height:1.2;letter-spacing:-.03em}.trip-date{margin:8px 0 0;color:var(--muted);font-size:14px}
    .day{scroll-margin-top:82px;margin:0 0 19px;padding:20px 17px 17px;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.day.is-today{border:2px solid var(--blue);padding:19px 16px 16px}.day-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.day-heading h2{margin:0;font-size:21px;letter-spacing:-.02em}.day-date{color:var(--muted);font-size:13px;white-space:nowrap}.today-tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:800;vertical-align:2px}
    .section-label{margin:17px 0 9px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em}.spot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid #edf0f5}.spot:last-child{border-bottom:0}.spot h3{margin:0;font-size:15px;line-height:1.35}.spot p{margin:4px 0 0;color:var(--muted);font-size:13px}.map-link{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:0 10px;border:1px solid #d8e2fb;border-radius:10px;background:#f6f8ff;color:var(--blue);font-size:12px;font-weight:750;text-decoration:none;white-space:nowrap}.map-link:active{background:var(--blue-soft)}
    .meals{display:grid;grid-template-columns:1fr;gap:0}.meal{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:13px}.meal:last-child{border-bottom:0}.meal strong{color:var(--muted)}
    .hotel{margin-top:17px;padding:14px;border-radius:14px;background:#f4f7fc}.hotel-label{margin:0 0 4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}.hotel-name{margin:0;font-size:14px;font-weight:700;line-height:1.55}.empty{color:var(--muted);font-weight:500}.footer{padding:6px 2px;color:var(--muted);font-size:12px;text-align:center}
    @media(min-width:560px){main{margin-top:32px}.day{padding:23px 24px 20px}.day.is-today{padding:22px 23px 19px}.meals{grid-template-columns:1fr 1fr;column-gap:18px}.meal:last-child{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    .file-actions{display:flex;gap:9px;margin-top:15px}.action-button{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:750}.action-button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.action-button:active{transform:translateY(1px)}.spot-list{min-height:30px;border-radius:13px;transition:background .15s,outline-color .15s}.spot-list.drop-active{outline:2px dashed var(--blue);outline-offset:3px;background:#f3f6ff}.spot-list:empty:after{display:block;padding:8px 4px;color:#97a2b4;font-size:12px;content:attr(data-empty)}.spot{grid-template-columns:26px minmax(0,1fr) auto auto auto;align-items:start;padding:10px 6px;border-radius:12px}.spot.dragging{opacity:.28}.drag-handle{width:25px;height:34px;padding:0;border:0;background:transparent;color:#8b97aa;font-size:18px;line-height:1;touch-action:none;cursor:grab}.drag-handle:active{color:var(--blue);cursor:grabbing}.spot-title{outline:none;border-radius:4px}.spot-title[contenteditable="true"]{background:#fff8df;box-shadow:0 0 0 2px #f2b84b}.backup-area{margin-top:18px;padding:13px 12px 8px;border:1px dashed #c9d3e3;border-radius:15px;background:#fafbfd}.backup-area .section-label{margin-top:0;color:#52617a}.backup-note{margin:-3px 0 7px;color:#8490a3;font-size:12px}.drag-ghost{position:fixed;z-index:50;pointer-events:none;max-width:min(80vw,360px);padding:10px 14px;border-radius:12px;background:#17233b;color:white;font-size:14px;font-weight:700;box-shadow:0 10px 30px #17233b44;opacity:.94}.drag-help{margin:9px 0 0;color:var(--muted);font-size:11px}
    .add-spot-form{display:flex;gap:7px;margin:8px 0 12px}.add-spot-form input{flex:1;min-width:0;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:13px}.add-spot-form input:focus{outline:2px solid #b8cafa;border-color:var(--blue)}.add-spot-form button{padding:0 11px;border:0;border-radius:10px;background:var(--blue-soft);color:var(--blue);font:inherit;font-size:12px;font-weight:750;white-space:nowrap}.delete-spot{width:34px;height:34px;padding:0;border:1px solid #f0dada;border-radius:9px;background:#fff8f8;color:#a43a3a;font-size:17px;line-height:1;cursor:pointer}.delete-spot:active{background:#ffe8e8}.add-to-itinerary{display:none;min-height:34px;padding:0 9px;border:1px solid #cfe0d5;border-radius:9px;background:#f1faf4;color:#277444;font:inherit;font-size:11px;font-weight:750;white-space:nowrap}.backup-list .add-to-itinerary{display:inline-flex;align-items:center;justify-content:center}
  </style>

  <script>
    (function(){
      const STORAGE_KEY='kansai-itinerary-state-v1';
      const embedded=JSON.parse(document.getElementById('itinerary-data').textContent);
      const nav=document.getElementById('day-nav'),daysRoot=document.getElementById('days');
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const copy=o=>JSON.parse(JSON.stringify(o));
      let state=null,todayIndex=-1,drag=null,lastTap={time:0,title:null},scrollTimer=null;
      function makeState(input,classify){
        if(!input||!Array.isArray(input['每日行程']))throw new Error('JSON 格式不正確：找不到「每日行程」清單。');
        const data=copy(input),backups={};
        data['每日行程'].forEach((day,i)=>{
          if(!Array.isArray(day['景點清單']))day['景點清單']=[];
          const main=[];backups[i]=[];
          day['景點清單'].forEach(item=>{
            const s=copy(item),name=String(s['名稱']||'');
            if(name.startsWith('【備選】')){s['名稱']=name.replace(/^【備選】\s*/,'');backups[i].push(s);}
            else if(classify&&i===3&&name.includes('推薦'))backups[i].push(s);
            else main.push(s);
          });day['景點清單']=main;
        });
        return {data,backups};
      }
      function persist(){
        state.data['每日行程'].forEach((day,i)=>{
          const section=document.getElementById('day-'+(i+1));if(!section)return;
          day['景點清單']=Array.from(section.querySelector('.main-list').querySelectorAll('.spot')).map(readSpot);
          state.backups[i]=Array.from(section.querySelector('.backup-list').querySelectorAll('.spot')).map(readSpot);
        });
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){ }
      }
      function readSpot(el){return {'名稱':el.querySelector('.spot-title').textContent.trim(),'簡短說明':el.querySelector('.spot-description').textContent.trim()};}
      function makeSpot(item){
        const el=document.createElement('article');el.className='spot';
        el.innerHTML='<button class="drag-handle" type="button" aria-label="拖曳調整景點">⠿</button><div class="spot-copy"><h3 class="spot-title" title="點兩下可修改名稱">'+esc(item['名稱'])+'</h3><p class="spot-description">'+esc(item['簡短說明'])+'</p></div><a class="map-link" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item['名稱'])+'" aria-label="在 Google 地圖搜尋 '+esc(item['名稱'])+'">⌖ 地圖</a><button class="add-to-itinerary" type="button">加入行程</button><button class="delete-spot" type="button" aria-label="刪除景點">×</button>';
        return el;
      }
      function render(){
        nav.replaceChildren();daysRoot.replaceChildren();
        document.getElementById('trip-title').textContent=state.data['行程名稱']||'行程';document.getElementById('trip-date').textContent=state.data['日期範圍']||'';
        const today=new Date();today.setHours(0,0,0,0);todayIndex=-1;
        state.data['每日行程'].forEach((d,i)=>{
          const n=i+1,id='day-'+n,date=new Date(String(d['日期']).replaceAll('/','-')+'T00:00:00'),isToday=today.getTime()===date.getTime();if(isToday)todayIndex=i;
          const link=document.createElement('a');link.href='#'+id;link.textContent='Day '+n;link.setAttribute('aria-label','前往第 '+n+' 天');if(isToday)link.setAttribute('aria-current','date');nav.appendChild(link);
          const sec=document.createElement('section');sec.className='day'+(isToday?' is-today':'');sec.id=id;
          sec.innerHTML='<div class="day-heading"><h2>Day '+n+(isToday?'<span class="today-tag">今天</span>':'')+'</h2><span class="day-date">'+esc(d['日期'])+'</span></div><p class="section-label">景點</p><div class="spot-list main-list" data-day="'+i+'" data-zone="main" data-empty="拖曳景點到這裡"></div><form class="add-spot-form" data-day="'+i+'" data-zone="main"><input type="text" maxlength="120" placeholder="新增景點名稱" aria-label="新增景點名稱"><button type="submit">新增並找地圖</button></form><div class="backup-area"><p class="section-label">備選</p><p class="backup-note">想去的景點可拖進上方景點清單。</p><div class="spot-list backup-list" data-day="'+i+'" data-zone="backup" data-empty="目前沒有備選景點"></div><form class="add-spot-form" data-day="'+i+'" data-zone="backup"><input type="text" maxlength="120" placeholder="新增備選景點名稱" aria-label="新增備選景點名稱"><button type="submit">新增並找地圖</button></form></div><p class="section-label">每日餐食</p><div class="meals">'+meal('早餐',d['早餐'])+meal('午餐',d['午餐'])+meal('晚餐',d['晚餐'])+'</div><div class="hotel"><p class="hotel-label">當晚住宿</p><p class="hotel-name '+(d['住宿飯店']==null?'empty':'')+'">'+(d['住宿飯店']==null?'未提供住宿資訊':esc(d['住宿飯店']))+'</p></div>';
          sec.querySelector('.main-list').append(...d['景點清單'].map(makeSpot));(state.backups[i]||[]).forEach(s=>sec.querySelector('.backup-list').appendChild(makeSpot(s)));daysRoot.appendChild(sec);
        });
        if(todayIndex>=0)requestAnimationFrame(()=>document.getElementById('day-'+(todayIndex+1)).scrollIntoView({block:'start',behavior:'smooth'}));
      }
      function meal(name,value){return '<div class="meal"><strong>'+name+'</strong><span class="'+(value==null?'empty':'')+'">'+(value==null?'未安排':esc(value))+'</span></div>';}
      function finishEdit(title,save){if(!title||title.contentEditable!=='true')return;title.contentEditable='false';if(!save)title.textContent=title.dataset.original;else{const card=title.closest('.spot'),name=title.textContent.trim()||title.dataset.original;title.textContent=name;card.querySelector('.map-link').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name);card.querySelector('.map-link').setAttribute('aria-label','在 Google 地圖搜尋 '+name);persist();}}
      function editTitle(title){if(title.contentEditable==='true')return;title.dataset.original=title.textContent;title.contentEditable='true';title.focus();const range=document.createRange();range.selectNodeContents(title);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);}
      daysRoot.addEventListener('dblclick',e=>{if(e.target.matches('.spot-title'))editTitle(e.target);});
      daysRoot.addEventListener('submit',e=>{const form=e.target.closest('.add-spot-form');if(!form)return;e.preventDefault();const input=form.querySelector('input'),name=input.value.trim();if(!name)return;const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name);const tab=window.open(url,'_blank');if(tab)tab.opener=null;const card=makeSpot({'名稱':name,'簡短說明':''});form.parentElement.querySelector('.spot-list[data-zone="'+form.dataset.zone+'"]').appendChild(card);input.value='';persist();});
      daysRoot.addEventListener('click',e=>{const add=e.target.closest('.add-to-itinerary');if(add){const card=add.closest('.spot'),day=add.closest('.day'),list=day.querySelector('.main-list');list.appendChild(card);persist();return;}const remove=e.target.closest('.delete-spot');if(!remove)return;remove.closest('.spot').remove();persist();});
      daysRoot.addEventListener('keydown',e=>{if(!e.target.matches('.spot-title[contenteditable="true"]'))return;if(e.key==='Enter'){e.preventDefault();finishEdit(e.target,true);e.target.blur();}if(e.key==='Escape'){finishEdit(e.target,false);e.target.blur();}});
      daysRoot.addEventListener('focusout',e=>{if(e.target.matches('.spot-title[contenteditable="true"]'))finishEdit(e.target,true);});
      function targetAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('.spot-list');}
      function positionGhost(x,y){if(drag?.ghost){drag.ghost.style.left=Math.min(x+14,innerWidth-220)+'px';drag.ghost.style.top=Math.min(y+14,innerHeight-70)+'px';}}
      function updateDrop(x,y){const list=targetAt(x,y);document.querySelectorAll('.drop-active').forEach(x=>x.classList.remove('drop-active'));if(list)list.classList.add('drop-active');drag.dropList=list;drag.dropSpot=(document.elementFromPoint(x,y)||{}).closest?.('.spot');}
      daysRoot.addEventListener('pointerdown',e=>{
        const card=e.target.closest('.spot');if(!card||e.target.closest('.map-link,.delete-spot,.add-to-itinerary,.spot-title[contenteditable="true"]'))return;
        if(e.pointerType==='touch'&&!e.target.closest('.drag-handle'))return;
        drag={card,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,active:false,dropList:null,dropSpot:null};
      });
      window.addEventListener('pointermove',e=>{
        if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;
        if(!drag.active&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>7){drag.active=true;drag.card.classList.add('dragging');const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=drag.card.querySelector('.spot-title').textContent;document.body.appendChild(ghost);drag.ghost=ghost;scrollTimer=setInterval(()=>{if(!drag)return;const edge=72;if(drag.y<edge)scrollBy(0,-Math.max(8,Math.round((edge-drag.y)/3)));else if(drag.y>innerHeight-edge)scrollBy(0,Math.max(8,Math.round((drag.y-(innerHeight-edge))/3)));},35);}
        if(drag.active){e.preventDefault();positionGhost(e.clientX,e.clientY);updateDrop(e.clientX,e.clientY);}
      },{passive:false});
      window.addEventListener('pointerup',e=>{
        if(!drag){if(e.target.matches?.('.spot-title')){const now=Date.now();if(lastTap.title===e.target&&now-lastTap.time<430){editTitle(e.target);lastTap={time:0,title:null};}else lastTap={time:now,title:e.target};}return;}
        if(drag){const d=drag;drag=null;if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}document.querySelectorAll('.drop-active').forEach(x=>x.classList.remove('drop-active'));d.card.classList.remove('dragging');d.ghost?.remove();
          if(d.active&&d.dropList&&d.dropSpot!==d.card){const spot=d.dropSpot;if(spot&&spot.parentElement===d.dropList){const r=spot.getBoundingClientRect();d.dropList.insertBefore(d.card,e.clientY>r.top+r.height/2?spot.nextSibling:spot);}else d.dropList.appendChild(d.card);persist();}
          else if(!d.active&&e.target.matches?.('.spot-title')){const now=Date.now();if(lastTap.title===e.target&&now-lastTap.time<430){editTitle(e.target);lastTap={time:0,title:null};}else lastTap={time:now,title:e.target};}
        }
      });
      window.addEventListener('pointercancel',()=>{if(drag){drag.card.classList.remove('dragging');drag.ghost?.remove();drag=null;}if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}document.querySelectorAll('.drop-active').forEach(x=>x.classList.remove('drop-active'));});
      document.getElementById('export-json').addEventListener('click',()=>{
        persist();const out=copy(state.data);out['每日行程'].forEach((d,i)=>{d['景點清單'].push(...(state.backups[i]||[]).map(s=>({...s,'名稱':'【備選】'+s['名稱']})));});
        const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='itinerary.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      });
      const fileInput=document.getElementById('json-file');document.getElementById('import-json').addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',async()=>{const file=fileInput.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());state=makeState(parsed,false);persist();render();}catch(err){alert('無法匯入：'+err.message);}finally{fileInput.value='';}});
      try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const parsed=JSON.parse(saved);if(parsed?.data&&parsed?.backups)state=parsed;}}catch(_){ }
      if(!state)state=makeState(embedded,true);render();
    })();
  </script>
</body>
</html>
